<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="How it works: Claude Code sends plan limits to the status line hook, which saves rate_limits.json; the widget, tray icon, top-bar pills and alerts read it. Claude Code also writes session logs, which the widget reads for tokens and cost.">
