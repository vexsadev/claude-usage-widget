name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen   # render without a display
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Install with the real installer
        run: python install.py --no-launch --skip-lib-check --no-gnome-extension

      - name: Render widget screenshot
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$LOCALAPPDATA/claude-usage-widget/venv/Scripts/python.exe";
          elif [ "$RUNNER_OS" = "macOS" ]; then PY="$HOME/Library/Application Support/claude-usage-widget/venv/bin/python";
          else PY="$HOME/.local/share/claude-usage-widget/venv/bin/python"; fi
          "$PY" -m claude_usage_widget --screenshot "widget-${RUNNER_OS}.png"

      - name: Status line hook
        shell: bash
        run: |
          CMD=$(python -c "import json,os;print(json.load(open(os.path.expanduser('~/.claude/settings.json')))['statusLine']['command'])")
          OUT=$(echo '{"model":{"display_name":"Opus 5.5"},"rate_limits":{"five_hour":{"used_percentage":31,"resets_at":4102444800}}}' | bash -c "$CMD")
          echo "$OUT"
          [[ "$OUT" == *"5h 31%"* ]]

      - name: Uninstall
        run: python install.py --uninstall

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: screenshots-${{ matrix.os }}
          path: widget-*.png
