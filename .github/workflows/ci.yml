name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest   # Ubuntu 26.04 runners no longer ship Python 3.9
            python: "3.9"
        include:
          - os: ubuntu-latest
            python: "3.10"
    env:
      QT_QPA_PLATFORM: offscreen   # render without a display
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Install with the real installer
        run: python install.py --no-launch --skip-lib-check --no-gnome-extension

      - name: Render widget screenshot
        shell: bash
        run: |
          # Qt's offscreen backend has no fonts on Windows; the native backend works on the runner
          if [ "$RUNNER_OS" = "Windows" ]; then export QT_QPA_PLATFORM=windows; fi
          if [ "$RUNNER_OS" = "Windows" ]; then PY="$LOCALAPPDATA/claude-usage-widget/venv/Scripts/python.exe";
          elif [ "$RUNNER_OS" = "macOS" ]; then PY="$HOME/Library/Application Support/claude-usage-widget/venv/bin/python";
          else PY="$HOME/.local/share/claude-usage-widget/venv/bin/python"; fi
          "$PY" -m claude_usage_widget --screenshot "widget-${RUNNER_OS}.png"

      - name: Status line hook
        shell: bash
        run: |
          CMD=$(python -c "import json,os;print(json.load(open(os.path.expanduser('~/.claude/settings.json')))['statusLine']['command'])")
          OUT=$(echo '{"model":{"display_name":"Opus 5.5"},"rate_limits":{"five_hour":{"used_percentage":31,"resets_at":4102444800}}}' | bash -c "$CMD")
          echo "$OUT"
          [[ "$OUT" == *"5h 31%"* ]]

      - name: Menu-bar pills (macOS)
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: |
          "$HOME/Library/Application Support/claude-usage-widget/venv/bin/python" - <<'EOF'
          import time
          from PySide6.QtGui import QActionGroup
          from PySide6.QtWidgets import QApplication, QMenu
          app = QApplication([])
          from claude_usage_widget import macbar

          # a menu shaped like the widget's: info row, separator, checkable submenu, plain action
          menu = QMenu()
          info = menu.addAction("5-hour: 96% used")
          info.setEnabled(False)
          menu.addSeparator()
          sub = menu.addMenu("Opacity")
          grp = QActionGroup(sub)
          for v in ("50%", "80%"):
              a = sub.addAction(v)
              a.setCheckable(True)
              grp.addAction(a)
          sub.actions()[0].setChecked(True)
          fired = []
          menu.addAction("Hide widget").triggered.connect(lambda: fired.append("hide"))

          bar = macbar.MenuBarPills(menu)  # directly, so errors aren't hidden by create()'s fallback
          now = time.time()
          bar.set_limits({"five_hour": (96, now + 2900), "seven_day": (41, now + 360000)})
          size = bar.button.image().size()
          label = bar.button.accessibilityLabel()
          print(f"menu-bar image {size.width:.0f} x {size.height:.0f} pt; {label}")
          assert size.width > 4 * size.height, size
          assert "96% 5h" in label and "41% wk" in label, label

          ns = bar.item.menu()
          assert ns is bar.nsmenu and ns.delegate() is bar.bridge
          info.setText("5-hour: 97% used")
          ns.delegate().menuNeedsUpdate_(ns)  # what macOS calls right before opening it
          titles = [ns.itemAtIndex_(i).title() for i in range(ns.numberOfItems())]
          print("native menu:", titles)
          assert titles == ["5-hour: 97% used", "", "Opacity", "Hide widget"], titles
          assert not ns.itemAtIndex_(0).isEnabled() and ns.itemAtIndex_(1).isSeparatorItem()
          opacity = ns.itemAtIndex_(2).submenu()
          assert [opacity.itemAtIndex_(i).state() for i in range(2)] == [1, 0]

          opacity.performActionForItemAtIndex_(1)  # native click -> QAction -> group exclusivity
          ns.performActionForItemAtIndex_(3)
          app.processEvents()
          print("checked:", [a.isChecked() for a in sub.actions()], "fired:", fired)
          assert [a.isChecked() for a in sub.actions()] == [False, True]
          assert fired == ["hide"]
          bar.setToolTip("Claude usage")
          bar.setVisible(False)
          EOF

      - name: Uninstall
        run: python install.py --uninstall

      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.13'
        with:
          name: screenshots-${{ matrix.os }}
          path: widget-*.png
